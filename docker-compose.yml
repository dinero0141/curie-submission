# Full stack: `docker compose up --build` (api on http://localhost:3000).
# Local dev / tests only need the data services: `docker compose up -d postgres redis`.
#
# App services read the repo-root `.env` if it exists (`required: false`: a missing file is fine).
# `environment:` below wins over that file, so the in-network database/Redis URLs always apply.
#
# MODEL_PROVIDER: shell value > `.env` value (compose reads `.env` for `${...}` interpolation) > `fake`.
# So with no `.env` (or no MODEL_PROVIDER in it) the stack runs keyless with the scripted demo model.
# For real answers set MODEL_PROVIDER=anthropic and ANTHROPIC_API_KEY (Claude), or MODEL_PROVIDER=gemini and
# GEMINI_API_KEY (Google Gemini; GEMINI_MODEL optional) in `.env`; env_file passes them to the containers.

x-app-env: &app-env
  DATABASE_URL: postgres://curie:curie@postgres:5432/curie
  REDIS_URL: redis://redis:6379
  MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}

x-app: &app
  image: curie-app:local
  build: .
  env_file:
    - path: .env
      required: false

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: curie
      POSTGRES_PASSWORD: curie
      POSTGRES_DB: curie
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curie -d curie"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    # BullMQ requires keys never be evicted.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["node", "dist/db/migrate.js"]
    environment:
      <<: *app-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "dist/api.js"]
    environment:
      <<: *app-env
      PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
    # worker.close() waits for active jobs, and one answer can run up to MODEL_TIMEOUT_MS (90 s), so the
    # grace period is above that: processors finish and write terminal state before SIGKILL. If a job is
    # still killed mid-stream (a longer MODEL_TIMEOUT_MS), its row stays in flight until BullMQ's stalled-job
    # check reruns it on the next worker (the rerun clears partial content first).
    stop_grace_period: 120s
    # The stalled-job rerun and the reconciler (lost jobs, stuck rows) run only in a live worker, so a crashed
    # worker must come back; without a restart the API keeps accepting work that nothing processes.
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
