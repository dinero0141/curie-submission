# Local dev services. The api/worker/migrate services added later load `.env` via
#   env_file: [{ path: .env, required: false }]
# so a missing .env never breaks `docker compose up`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: curie
      POSTGRES_PASSWORD: curie
      POSTGRES_DB: curie
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curie -d curie"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    # BullMQ requires keys never be evicted.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
